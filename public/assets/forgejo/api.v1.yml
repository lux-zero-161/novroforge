openapi: 3.0.0
info:
  title: NovroForge API
  description: |-
    NovroForge REST API

  contact:
    email: zero@novroforge.xyz
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
  version: 1.0.0
externalDocs:
  description: Find out more about NovroForge
  url: https://novroforge.xyz
servers:
  - url: /api/v1
paths:
  /version:
    get:
      summary: API version
      description: Semantic version of the NovroForge API
      operationId: getVersion
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Version'
components:
  schemas:
    Version:
      type: object
      properties:
        version:
          type: string

