categorize: './release-notes-assistant.sh'
branch-development: 'novroforge'
branch-pattern: 'v*/novroforge'
branch-find-version: 'v(?P<version>\d+\.\d+)/novroforge'
branch-to-version: '${version}.0'
branch-from-version: 'v%[1]d.%[2]d/novroforge'
tag-from-version: 'v%[1]d.%[2]d.%[3]d'
supported-release-count: 3
branch-known:
# replace with v19 when v15 becomes EOL
  - 'v15.0/novroforge'
cleanup-line: 'sed -Ee "s/^(feat|fix):\s*//g" -e "s/^\[WIP\] //" -e "s/^WIP: //" -e "s;\[(UI|BUG|FEAT|v.*?/novroforge)\]\s*;;g"'
render-header: |

  ## Release notes
comment: |
  <details>
  <summary>Where does that come from?</summary>
  The following is a preview of the release notes for this pull request, as they will appear in the upcoming release. They are derived from the content of the `%[2]s/%[3]s.md` file, if it exists, or the title of the pull request. They were also added at the bottom of the description of this pull request for easier reference.

  This message and the release notes originate from a call to the [release-notes-assistant](https://code.novroforge.xyz/novroforge/release-notes-assistant).

  ```diff
  %[4]s
  ```

  </details>

  %[1]s
